[project]
name = "opencrab-starter"
version = "0.1.0"
description = "Generic local starter for AI-ready business file indexing"
requires-python = ">=3.11"
dependencies = [
  "openpyxl",
  "Pillow",
  "pypdf",
  "msal[broker]>=1.20,<2",
]

[project.optional-dependencies]
desktop-build = ["pyinstaller>=6.21,<7"]

[tool.ruff]
line-length = 100
