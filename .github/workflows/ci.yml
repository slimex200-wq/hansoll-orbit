name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # ORBIT targets Windows only: the WAM broker, Outlook connector and path
    # handling are all win32 specific, so the engine has to be verified there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run engine tests
        run: python -m pytest -q

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        # The Electron binary is only needed for packaging and the Playwright
        # suites, not for the main/renderer unit tests or the build.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Run main process and release script tests
        run: npm test
      - name: Build renderer
        run: npx vite build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
